name: Node en pnpm
description: >-
  Node 22, pnpm uit package.json via corepack, de pnpm-store uit de cache, en
  een install. Eén plek voor wat elke job deed met pnpm/action-setup,
  setup-node en pnpm install.

# Eerst deed elke job pnpm/action-setup (4 tot 8 s: pnpm via npm) en
# setup-node met `cache: pnpm`. Corepack zit in Node en haalt de pnpm uit
# `packageManager` in een seconde; de store-cache staat hier zelf, zodat een
# job zonder install (plan, cross-links) hem niet hoeft op te halen. Een
# site-build installeert met `filter` alleen die site en wat hij nodig heeft.

inputs:
  pnpm:
    description: pnpm via corepack aanzetten.
    default: 'true'
  store:
    description: De pnpm-store uit de cache halen (en bij een misser bewaren).
    default: 'true'
  install:
    description: pnpm install --frozen-lockfile draaien.
    default: 'true'
  filter:
    description: >-
      Alleen deze projecten installeren, als pnpm-filter (bijvoorbeeld
      `./sites/informatica/python...`: de site en zijn workspace-packages).
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        # De store-cache doen we hieronder zelf.
        package-manager-cache: false

    - name: pnpm via corepack
      if: inputs.pnpm == 'true'
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        corepack enable
        echo "pnpm $(pnpm --version)"

    - name: Map van de pnpm-store
      id: store
      if: inputs.pnpm == 'true' && inputs.store == 'true'
      shell: bash
      run: echo "pad=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: pnpm-store uit de cache
      if: inputs.pnpm == 'true' && inputs.store == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.store.outputs.pad }}
        key: pnpm-store-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-node22-

    - name: Install dependencies
      if: inputs.pnpm == 'true' && inputs.install == 'true'
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: |
        if [ -n "$FILTER" ]; then
          pnpm install --frozen-lockfile --filter "$FILTER"
        else
          pnpm install --frozen-lockfile
        fi
