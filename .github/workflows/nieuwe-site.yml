name: Nieuwe site afmaken

# docs-management maakt een nieuwe site op een branch `nieuwe-site-<id>`, maar
# draait zelf geen Node. Wat uit de bronbestanden volgt, maakt deze workflow:
# de regel in pnpm-lock.yaml (anders weigert `--frozen-lockfile` elke job), de
# gegenereerde huisstijl (logo's, cursus-CSS) en de opmaak van Biome. Daarna
# start hij Build sites op de nieuwe commit: een push met GITHUB_TOKEN start
# geen workflows, een workflow_dispatch wel. Zonder deze stap brak
# Hartjespuzzel (#157) elke build op main.

on:
  push:
    branches: ['nieuwe-site-**']
  # Om een branch van vóór deze workflow alsnog af te maken:
  # gh workflow run nieuwe-site.yml --ref nieuwe-site-<id>
  workflow_dispatch:

concurrency:
  group: nieuwe-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  afmaken:
    # Onze eigen commit hieronder start deze workflow niet opnieuw (GITHUB_TOKEN),
    # maar een push van een mens daarna wel; dan is er meestal niets te doen.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/node-pnpm
        with:
          install: 'false'

      - name: Lockfile bijwerken
        run: pnpm install --lockfile-only

      - name: Installeren
        run: pnpm install --frozen-lockfile

      - name: Huisstijl genereren
        run: node scripts/genereer-huisstijl.mjs

      # Alleen opmaak: een lintfout die Biome niet zelf oplost, mag het afmaken
      # niet tegenhouden; die meldt Build sites.
      - name: Opmaak
        run: pnpm exec biome format --write .

      - name: Committen en de build starten
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Niets af te maken."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Nieuwe site afmaken: lockfile, huisstijl en opmaak"
          git push origin "HEAD:$BRANCH"
          gh workflow run build.yml --ref "$BRANCH" -f volledig=true
