name: Build sites

# Bouwt elke site naar een zelfstandige statische bundle en uploadt die
# als artifact. Geen deploy hier: een aparte backend pakt de artifacts op
# (hosting, A/B-tests, analytics).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Snel achter elkaar pushen op dezelfde branch: alleen de nieuwste build telt.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blokkerend, in tegenstelling tot de lint hieronder: de nakijker bepaalt
      # wat een leerling als beoordeling ziet, en een scoringsfout geeft geen
      # foutmelding — die telt gewoon stil iets verkeerd. Draait in een seconde,
      # dus vóór de trage typecheck.
      - name: Test (nakijker)
        run: pnpm test

      # Niet-blokkerend: de uit losse repos gemigreerde sites hebben nog
      # honderden bestaande biome-fouten. Zodra die zijn opgeschoond kan
      # continue-on-error weg.
      - name: Lint (biome)
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck (sites + packages)
        run: pnpm typecheck

  build:
    # Wacht op checks. De hostingbackend haalt de artifacts óók op als de run
    # is mislukt (bewust: met fail-fast:false mag één kapotte site de andere
    # niet blokkeren). Zonder deze afhankelijkheid zou een nakijker met rode
    # tests dus alsnog live gaan.
    #
    # Let op wat dit precies doet: het hangt aan de héle checks-job, dus ook de
    # typecheck. Een tsc-fout in één site levert nu nul artifacts op voor alle
    # sites, waar ze eerder gewoon werden gebouwd. Dat is bewust — bij rode
    # checks is de eerste taak die repareren, niet deployen — maar het kost je
    # wel het overzicht van welke sites nog wél bouwen. Wil je alleen op de
    # tests blokkeren, splits die dan af naar een eigen job en verwijs
    # daarnaar; dat kost een tweede pnpm install.
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mapnamen onder sites/; het filter werkt op de map, niet op de
        # package-naam (sites/ide heet @coderius/ide, zonder -docs-suffix).
        site:
          - python
          - web
          - fullstack
          - robotica
          - ctf
          - embedded
          - editor
          - godot
          - dvwa
          - play
          - algorithms
          - ide
          - didactiek
          - home
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.site }}
        run: pnpm --filter "./sites/${{ matrix.site }}" build

      - name: Upload static bundle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.site }}-static
          path: sites/${{ matrix.site }}/build
          if-no-files-found: error
