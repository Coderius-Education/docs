name: Build sites

# Bouwt elke geraakte site naar een zelfstandige statische bundle en uploadt
# die als artifact. Geen deploy hier: een aparte backend pakt de artifacts op
# (hosting, A/B-tests, analytics). Een site zonder artifact in deze run blijft
# daar staan zoals hij was: previews vallen terug op main, en op main wordt
# per artifact bijgewerkt.
#
# Incrementeel: de job `plan` bepaalt wat de wijziging raakt
# (scripts/wijzigingen.mjs, logica en tests in packages/shared/wijzigingen.js)
# en elke job hieronder doet alleen dat. Een les van één regel bouwt één site,
# draait de codeblokken rond die regel en controleert de tekst van die regel.
# Elke nacht, en bij een handmatige run, draait alles: zo valt drift op die
# geen enkele wijziging raakte (een nieuwe Python, een verlopen pin).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      volledig:
        description: 'Alles controleren, ook wat niet gewijzigd is'
        type: boolean
        default: true

# Snel achter elkaar pushen op dezelfde branch: alleen de nieuwste build telt.
# De nachtelijke run heeft een eigen groep, zodat een push hem niet afbreekt.
concurrency:
  group: build-${{ github.event_name == 'schedule' && 'nacht' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Wat raakt deze wijziging? Vergelijkt met de merge-base van de PR (of met
  # `before` bij een push op main), mapt de gewijzigde regels op sites, jobs
  # en codeblokken, en zet dat in changed.json (artifact `wijzigingen`). Elke
  # job hieronder leest dat bestand. Geen bruikbare base, of een globaal
  # bestand gewijzigd (lockfile, root-config, deze workflow): alles.
  plan:
    runs-on: ubuntu-latest
    outputs:
      volledig: ${{ steps.plan.outputs.volledig }}
      sites: ${{ steps.plan.outputs.sites }}
      ongewijzigd: ${{ steps.plan.outputs.ongewijzigd }}
      build: ${{ steps.plan.outputs.build }}
      test: ${{ steps.plan.outputs.test }}
      checks: ${{ steps.plan.outputs.checks }}
      tekst: ${{ steps.plan.outputs.tekst }}
      crosslinks: ${{ steps.plan.outputs.crosslinks }}
      browser: ${{ steps.plan.outputs.browser }}
      python: ${{ steps.plan.outputs.python }}
      algorithms: ${{ steps.plan.outputs.algorithms }}
      play: ${{ steps.plan.outputs.play }}
      godot: ${{ steps.plan.outputs.godot }}
      robotica: ${{ steps.plan.outputs.robotica }}
      fullstack: ${{ steps.plan.outputs.fullstack }}
      blokken: ${{ steps.plan.outputs.blokken }}
    steps:
      # De hele geschiedenis, maar zonder blobs: git merge-base en pnpm's
      # `[<base>]`-filter hebben alleen commits en trees nodig, en git diff
      # haalt de paar gewijzigde bestanden zelf op.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      # Geen install en geen store: het plan heeft alleen pnpm nodig (voor
      # `--filter "...[<base>]"`).
      - name: Node en pnpm
        uses: ./.github/actions/node-pnpm
        with:
          store: 'false'
          install: 'false'

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          VOLLEDIG: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.volledig) }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$VOLLEDIG" = "true" ]; then
            node scripts/wijzigingen.mjs plan --volledig --reden "$EVENT"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            # Handmatig op een branch, zonder volledig: vergelijk met main.
            node scripts/wijzigingen.mjs plan --base "$(git rev-parse origin/main)"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            node scripts/wijzigingen.mjs plan --volledig --reden "handmatig op main"
          else
            node scripts/wijzigingen.mjs plan --base "$BASE"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: wijzigingen
          path: changed.json
          retention-days: 7

  # Aparte, kleine job omdat `publiceer` erop wacht. De nakijker bepaalt wat
  # een leerling als beoordeling ziet, en een scoringsfout geeft geen
  # foutmelding — die telt gewoon stil iets verkeerd. Zulke code mag niet
  # gedeployd worden. De builds wachten er niet op: die draaien tegelijk, en
  # alleen het publiceren als `<site>-static` wacht.
  #
  # Bewust niet samen met lint en typecheck in één job: dan zou een tsc-fout in
  # een willekeurige site de artifacts van alle veertien tegenhouden, en zou de
  # trage typecheck (~30s) het publiceren vertragen.
  #
  # Incrementeel: `vitest related` op de gewijzigde code, plus de tests die
  # lestekst of andere bestanden lezen in plaats van importeren (die ziet
  # related niet) uit elk package waarin iets veranderde, en de guards die over
  # alle sites lopen. De vitest-config of -setup gewijzigd: alles.
  test:
    needs: plan
    if: needs.plan.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Node, pnpm en dependencies
        uses: ./.github/actions/node-pnpm

      # De stap-voor-stap-opnemer is Python die in de browser in Pyodide draait.
      # Zijn test draait hem tegen een echte CPython, en die hoort dezelfde
      # taalversie te spreken als Pyodide meelevert: 3.13, zowel in de
      # gebundelde als in de CDN-variant. De runner heeft standaard wel een
      # python3, maar niet noodzakelijk die versie.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v6
        with:
          name: wijzigingen

      - name: Test (nakijker, editor, DVWA-labs en de stap-opnemer)
        run: |
          read -ra argumenten <<< "$(node scripts/wijzigingen.mjs vitest changed.json)"
          pnpm exec vitest "${argumenten[@]}"

      # De selectie van --alleen in de blokrunners (scripts/alleen.py).
      - name: Test (blokrunners)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # De dekking van de python-runner, met de ondergrens uit vitest.config.ts.
      # Alleen als zijn tests in de selectie zitten: een deelrun van andere
      # tests zegt niets over zijn dekking.
      - name: Dekking van de python-runner
        run: |
          argumenten="$(node scripts/wijzigingen.mjs vitest changed.json)"
          if [ "$argumenten" = "run" ] || grep -q 'packages/python-runner/' <<< "$argumenten"; then
            pnpm test:dekking
          else
            echo "De python-runner is niet geraakt."
          fi

  # Vijf blokrunners in één job, tegelijk. Elk draait de codevoorbeelden uit
  # de lessen van één cursus:
  #
  #   python      elk blok draait, de beloofde uitvoer (commentaar achter een
  #               print, of een uitvoerblok eronder) wordt vergeleken, en de
  #               geciteerde foutmeldingen worden gereproduceerd. Op 3.13, de
  #               Python van Pyodide 0.29.4 in de speeltuin.
  #   algorithms  dezelfde controle, ook op 3.13, met numpy en matplotlib
  #               gepind op de versies van de wheels die de site serveert
  #               (static/pyodide/, --pins). Voor matplotlib 3.8.4 heeft PyPI
  #               geen wheel voor 3.13; pip bouwt hem uit de bron (een paar
  #               minuten), en de pip-cache hieronder bewaart die wheel tot de
  #               wheels van de site veranderen.
  #   play        elk speeltuin-blok draait echt tegen de gebundelde wheel uit
  #               static/whl/, met precies de pygame/numpy die de wheel pint.
  #   robotica    elk MicroPython-blok compileert; er is geen board in CI.
  #   godot       Godot headless: elk blok compileren, de zeven tussenstanden
  #               van het bewegingsscript echt uitvoeren, en elk menu-item uit
  #               de lessen opzoeken in de editor-binary. De godot-cursus laat
  #               leerlingen elk script zelf opbouwen, dus staan de
  #               tussenstanden alleen in de lestekst; niets anders leest ze.
  #
  # Eerst waren het vijf jobs. Samen met vijftien site-builds en de andere
  # jobs waren dat er 24 in de eerste golf van een brede run, terwijl GitHub er
  # twintig tegelijk draait: vier jobs, waaronder `test`, wachtten zo'n 28 s op
  # een runner. Play en algorithms pinnen een andere numpy, dus elke runner
  # met pip krijgt een eigen venv. Bewust kapotte voorbeelden dragen een
  # niet-draaien- of niet-compileren-marker.
  #
  # Met --alleen draaien alleen de blokken rond de gewijzigde regels, plus wat
  # erop doorbouwt (draaien-met); godot slaat dan ook de gedragstest over van
  # een tussenstand die niet veranderde. De vlaggen heten BLOK_…, want node-gyp
  # leest een variabele PYTHON als het pad naar Python. Telt mee voor de
  # verplichte check `build` (zie build-klaar), maar houdt de artifacts niet
  # tegen.
  blokken:
    needs: plan
    if: needs.plan.outputs.blokken == 'true'
    runs-on: ubuntu-latest
    env:
      BLOK_PYTHON: ${{ needs.plan.outputs.python }}
      BLOK_ALGORITHMS: ${{ needs.plan.outputs.algorithms }}
      BLOK_PLAY: ${{ needs.plan.outputs.play }}
      BLOK_ROBOTICA: ${{ needs.plan.outputs.robotica }}
      BLOK_GODOT: ${{ needs.plan.outputs.godot }}
      GODOT_VERSIE: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5

      # Robotica en godot halen hun blokken met pnpm uit de docs; python haalt
      # zijn blokken na CPython ook door de speeltuin in Pyodide (vitest).
      - name: Node, pnpm en dependencies
        if: env.BLOK_ROBOTICA == 'true' || env.BLOK_GODOT == 'true' || env.BLOK_PYTHON == 'true'
        uses: ./.github/actions/node-pnpm

      - name: Cache Godot
        id: godot-cache
        if: env.BLOK_GODOT == 'true'
        uses: actions/cache@v5
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSIE }}

      # De bestandsnaam van het asset is per release wel eens veranderd, dus
      # zoeken we hem op in plaats van hem te raden.
      - name: Download Godot
        if: env.BLOK_GODOT == 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          url=$(gh api "repos/godotengine/godot-builds/releases/tags/${GODOT_VERSIE}" \
            --jq '.assets[] | select(.name | test("linux\\.x86_64\\.zip$")) | .browser_download_url' | head -1)
          echo "Asset: $url"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          mv "$(find /tmp/godot -type f -name 'Godot_v*' | head -1)" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.12
            3.13

      - uses: actions/download-artifact@v6
        with:
          name: wijzigingen

      # De wheel van matplotlib die pip voor algorithms uit de bron bouwt.
      - name: Cache pip (algorithms)
        if: env.BLOK_ALGORITHMS == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-algorithms-${{ runner.os }}-${{ hashFiles('sites/informatica/algorithms/static/pyodide/*.whl') }}

      - name: Codevoorbeelden van python, algorithms, play, robotica en godot
        run: |
          set -uo pipefail
          logs="$RUNNER_TEMP/blokken"
          mkdir -p "$logs"
          # venv <naam> <python> [pip-argumenten…]: een eigen venv per runner.
          venv() {
            local map="$RUNNER_TEMP/venv-$1" python=$2
            shift 2
            "$python" -m venv "$map" && { [ $# -eq 0 ] || "$map/bin/pip" install -q "$@"; }
          }
          # Eerst CPython, dan dezelfde blokken door runPython in Pyodide, zoals
          # de speeltuin ze draait (lessen-in-pyodide.test.ts).
          python_() {
            local blokken="$RUNNER_TEMP/python-blokken.json"
            python3.13 scripts/draai-python-blokken.py --alleen changed.json --json "$blokken" &&
              CODERIUS_BLOKKEN_JSON="$blokken" pnpm exec vitest run packages/python-runner/src/lessen-in-pyodide.test.ts
          }
          algorithms_() {
            # shellcheck disable=SC2046
            venv algorithms python3.13 $(python3.13 scripts/draai-python-blokken.py algorithms --pins) &&
              "$RUNNER_TEMP/venv-algorithms/bin/python" scripts/draai-python-blokken.py algorithms --alleen changed.json
          }
          play_() {
            # shellcheck disable=SC2046
            venv play python3.12 $(python3.12 scripts/draai-play-blokken.py --pins) &&
              "$RUNNER_TEMP/venv-play/bin/python" scripts/draai-play-blokken.py --alleen changed.json
          }
          robotica_() {
            pnpm --filter @coderius/robotica-docs lego:extract &&
              python3.13 scripts/compileer-blokken.py sites/informatica/robotica/lego-tests/extracted --alleen changed.json
          }
          godot_() {
            local tests=sites/informatica/godot/godot-tests
            ~/godot-bin/godot --headless --version &&
              pnpm --filter @coderius/godot-docs godot:extract --alleen "$GITHUB_WORKSPACE/changed.json" &&
              # De eerste run bouwt de importcache op en eindigt met een
              # exitcode die niets over de tests zegt, vandaar de tweede.
              { ~/godot-bin/godot --headless --path "$tests" --import || true; } &&
              # Geen --quit-after: die stopt met code 0 en zou een echte fout
              # maskeren. `timeout` is alleen het vangnet tegen vastlopen.
              timeout 300 ~/godot-bin/godot --headless --path "$tests" &&
              godot_labels "$tests/extracted/labels.txt"
          }
          # Een hernoemd menu-item verandert niets aan de code en niets aan de
          # build; het valt pas op als een leerling naar een knop zoekt die er
          # niet meer is. De editor-binary bevat zijn eigen labels, dus die
          # zoeken we er gewoon in op (een substring: Godot hangt er soms iets
          # achter, zoals "Add Child Node...").
          godot_labels() {
            local mist=0 label
            strings -n 2 ~/godot-bin/godot > "$RUNNER_TEMP/godot-strings.txt"
            while IFS= read -r label; do
              [ -z "$label" ] && continue
              if ! grep -qF "$label" "$RUNNER_TEMP/godot-strings.txt"; then
                echo "::error::label '$label' komt niet voor in Godot ${GODOT_VERSIE}"
                mist=$((mist + 1))
              fi
            done < "$1"
            echo "$(wc -l < "$1") labels gecontroleerd, $mist niet gevonden."
            [ "$mist" -eq 0 ]
          }
          runners=()
          declare -A pid
          for naam in python algorithms play robotica godot; do
            aan="BLOK_${naam^^}"
            [ "${!aan}" = true ] || continue
            runners+=("$naam")
            "${naam}_" > "$logs/$naam.log" 2>&1 &
            pid[$naam]=$!
          done
          fout=0
          for naam in "${runners[@]}"; do
            if wait "${pid[$naam]}"; then uitkomst=geslaagd; else uitkomst=mislukt; fout=1; fi
            echo "::group::$naam ($uitkomst)"
            cat "$logs/$naam.log"
            echo "::endgroup::"
            if [ "$uitkomst" = mislukt ]; then echo "::error::blokrunner $naam is mislukt; zie de groep $naam hierboven"; fi
          done
          exit $fout

  # De fullstack-cursus: python-blokken die nergens worden uitgevoerd.
  # Extractie én compilatie deelt deze job met robotica (in `blokken`)
  # (packages/shared/codeblokken.js en scripts/compileer-blokken.py). Bewust
  # kapotte voorbeelden — de FOUT/GOED-blokken in troubleshooting en losse
  # fragmenten uit een handler — slaan we over met de marker
  # `{/* niet-compileren: reden */}`.
  #
  # Daarna het controlescript voor leerlingen (static/controleer.py): het
  # draait met uvicorn tegen het eindproject van de basis
  # (src/controle/referentie/), dat elk hoofdstuk goed moet hebben, en tegen
  # een kopie met bekende fouten (src/controle/kapot.py), waarin elke fout
  # zijn ✗ moet geven. Op Python 3.10, de oudste die het script belooft, en
  # met dezelfde packages als de installatieles.
  #
  # Een eigen job, niet in `blokken`: het controlescript start twee processen
  # per core, en naast de andere runners duurde het daar 90 s in plaats van
  # een kleine minuut.
  fullstack:
    needs: plan
    if: needs.plan.outputs.fullstack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Node, pnpm en dependencies
        uses: ./.github/actions/node-pnpm

      - name: Codeblokken uit de docs halen
        run: pnpm --filter @coderius/fullstack-docs code:extract

      - uses: actions/download-artifact@v6
        with:
          name: wijzigingen

      - name: Codevoorbeelden compileren
        run: python3 scripts/compileer-blokken.py sites/informatica/fullstack/code-tests/extracted --alleen changed.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Packages van de cursus installeren
        run: python -m pip install "fastapi[standard]" sqlitedict

      - name: Controlescript tegen het referentieproject en een kapotte kopie
        run: python sites/informatica/fullstack/src/controle/draai.py


  # Lestekst is het product van deze repo, maar niets controleerde hem. Een
  # typefout, een emoji, een "u" in plaats van "je" of een alinea vol vet:
  # de build merkt er niets van en een reviewer die honderden regels diff
  # doorleest ook niet. Deze job doet twee dingen op elke lespagina in de
  # repo:
  #
  #   spelling  cspell met de nl_NL-dictionary plus cspell-woorden.txt, de
  #             eigen lijst met vaktermen en samenstellingen.
  #   stijl     de regels uit org-handbook/WRITING_STYLE_GUIDE.md, uitgevoerd
  #             door packages/shared/stijl.js. Code, frontmatter en JSX gaan
  #             er eerst uit; een uitroepteken in print("Klaar!") is geen
  #             stijlfout.
  #
  # De achterstand uit de migratie is weggewerkt, dus deze job wordt rood op
  # een onbekend woord of een stijlfout (--streng). Stijlwaarschuwingen tellen
  # niet mee; die staan als annotatie in de diff. Bewust niet blokkerend: hij
  # telt niet mee voor de verplichte check `build`, dus een spel- of
  # stijlfout houdt een merge niet tegen. Dat is een keuze van de
  # opdrachtgever, geen achterstand (ci-poort.test.ts).
  #
  # De regels zelf zijn getest in packages/shared/stijl.test.ts, en die test
  # loopt in de `test`-job wél blokkerend mee. Zo kan een regel niet stilletjes
  # stukgaan en toch groen blijven.
  #
  # Incrementeel: alleen gewijzigde lespagina's, en alleen meldingen die een
  # gewijzigde regel raken (`--regels`). Een melding over meer regels (een
  # alinea) telt als één ervan gewijzigd is. De woordenlijst, de
  # cspell-config of de stijlregels gewijzigd: alles.
  tekst:
    needs: plan
    if: needs.plan.outputs.tekst == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Node, pnpm en dependencies
        uses: ./.github/actions/node-pnpm

      - uses: actions/download-artifact@v6
        with:
          name: wijzigingen

      # cspell schrijft "bestand:regel:kolom - Unknown word (x)". Dat omzetten
      # naar een annotatie zet de melding op de juiste regel in de diff in
      # plaats van onderin het joblog. Incrementeel spelt hij alleen de
      # gewijzigde pagina's, en filtert `wijzigingen.mjs filter` de meldingen
      # op gewijzigde regels; een cspell-fout die geen spelmelding is (een
      # kapotte config) laat de stap zelf falen.
      - name: Spelling (cspell)
        run: |
          set -uo pipefail
          if jq -e '.volledig or .tekst.alles' changed.json > /dev/null; then
            pnpm run spel > "$RUNNER_TEMP/spel.txt" 2>&1 || uitkomst=$?
          else
            mapfile -t bestanden < <(node scripts/wijzigingen.mjs cspell changed.json)
            pnpm exec cspell lint --no-progress --relative --no-must-find-files "${bestanden[@]}" \
              > "$RUNNER_TEMP/spel-alles.txt" 2>&1 || cspell=$?
            if [ "${cspell:-0}" -ne 0 ] && ! grep -q 'Unknown word' "$RUNNER_TEMP/spel-alles.txt"; then
              cat "$RUNNER_TEMP/spel-alles.txt"
              exit "$cspell"
            fi
            node scripts/wijzigingen.mjs filter changed.json < "$RUNNER_TEMP/spel-alles.txt" \
              > "$RUNNER_TEMP/spel.txt" || uitkomst=$?
          fi
          sed -n 's|^\(.*\):\([0-9]*\):\([0-9]*\) - \(.*\)$|::warning file=\1,line=\2,col=\3,title=spelling::\4|p' "$RUNNER_TEMP/spel.txt"
          cat "$RUNNER_TEMP/spel.txt"
          aantal=$(grep -c 'Unknown word' "$RUNNER_TEMP/spel.txt" || true)
          {
            echo "## Spelling"
            echo
            echo "$aantal onbekende woorden. Klopt een woord wel? Zet het in \`cspell-woorden.txt\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${uitkomst:-0}"

      # Schrijft zelf al annotaties en een tabel in de job-samenvatting.
      - name: Stijl (schrijfgids)
        run: node scripts/controleer-tekst.mjs --streng --regels changed.json

  # Incrementeel: biome alleen op gewijzigde bestanden (`--changed`; biome.json
  # gewijzigd: alles), en tsc alleen op de packages die pnpm geraakt noemt.
  checks:
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    runs-on: ubuntu-latest
    steps:
      # biome --changed vergelijkt met de base, dus die commit moet er zijn.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Node, pnpm en dependencies
        uses: ./.github/actions/node-pnpm

      - uses: actions/download-artifact@v6
        with:
          name: wijzigingen

      # Blokkerend: de biome-achterstand uit de migratie is opgeruimd, dus een
      # lintfout is weer een fout. Samen met de typecheck telt deze job mee in
      # de `build`-check hieronder.
      - name: Lint (biome)
        run: |
          set -euo pipefail
          if jq -e '.volledig or .jobs.lint' changed.json > /dev/null; then
            pnpm lint
          else
            pnpm exec biome check --changed --since="$(jq -r .base changed.json)" --no-errors-on-unmatched
          fi

      - name: Typecheck (geraakte sites + packages)
        run: |
          set -euo pipefail
          if jq -e '.volledig' changed.json > /dev/null; then
            pnpm typecheck
          else
            read -ra filters <<< "$(node scripts/wijzigingen.mjs typecheck changed.json)"
            if [ "${#filters[@]}" -gt 0 ]; then
              pnpm "${filters[@]}" -r typecheck
            else
              echo "Geen site of package geraakt; niets te typechecken."
            fi
          fi

  # Bouwt elke geraakte site, tegelijk met de tests: de bundle heet hier
  # `<site>-gebouwd`, en pas `publiceer` (na groene tests) zet hem als
  # `<site>-static` klaar voor de hostingbackend. Eerst wachtte de build op
  # de tests (een minuut), terwijl alleen het publiceren erop hoeft te wachten.
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Alleen de geraakte sites, uit de plan-job (site-ids uit
        # packages/shared/sites.js). De map (sites/<vak>/<id>, of sites/home)
        # komt uit de registry; het filter werkt op de map, niet op de
        # package-naam (ide heet @coderius/ide, zonder -docs-suffix).
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    steps:
      - uses: actions/checkout@v5

      # De install pas na de sleutels (zie hieronder), en zonder de
      # pnpm-store uit de cache: zie `map` in .github/actions/node-pnpm.
      - name: Node en pnpm
        uses: ./.github/actions/node-pnpm
        with:
          store: 'false'
          install: 'false'

      # Vóór de install, net als in `voorraad`: zo kan niets wat de install
      # neerzet de sleutel laten verschillen.
      - name: Map en cache-sleutel van ${{ matrix.site }}
        id: map
        run: |
          echo "dir=$(node scripts/sites-json.mjs ${{ matrix.site }})" >> "$GITHUB_OUTPUT"
          echo "sleutel=site-${{ runner.os }}-${{ matrix.site }}-$(node scripts/site-hash.mjs ${{ matrix.site }})" >> "$GITHUB_OUTPUT"

      # Alleen deze site en de workspace-packages waar hij van afhangt; de
      # andere sites en de gereedschappen van de root (vitest, biome, cspell)
      # heeft een build niet nodig. De accolades zijn nodig: "./map..." is
      # voor pnpm alleen de map, zonder packages/shared en zijn letters.
      - name: Install dependencies
        env:
          MAP: ${{ steps.map.outputs.dir }}
        run: pnpm install --frozen-lockfile --filter "{./$MAP}..."

      - name: Build ${{ matrix.site }}
        run: pnpm --filter "./${{ steps.map.outputs.dir }}" build

      # .gz en .br naast elk tekstbestand en elke wasm, voor een server die
      # vooraf gecomprimeerde bestanden serveert (packages/shared/comprimeer.js).
      # Na de build en niet in een postBuild: die draaien tegelijk, en dan kan
      # een bestand van een andere plugin ontbreken.
      - name: Comprimeren
        run: node scripts/comprimeer.mjs "${{ steps.map.outputs.dir }}/build"

      # Voor cross-links in een latere run waarin deze site niet verandert. De
      # sleutel is een hash van alles waar de build van afhangt
      # (scripts/site-hash.mjs), dus een treffer is dezelfde build.
      - name: Build in de cache
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.map.outputs.dir }}/build
          key: ${{ steps.map.outputs.sleutel }}

      # Nog niet voor de hostingbackend (die pakt `<site>-static`): voor
      # cross-links en voor `publiceer`. Even lang bewaard als `wijzigingen`:
      # draait iemand een rode test later opnieuw, dan publiceert `publiceer`
      # deze bundle alsnog, en die moet er dan nog zijn.
      - name: Upload gebouwde bundle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.site }}-gebouwd
          path: ${{ steps.map.outputs.dir }}/build
          if-no-files-found: error
          retention-days: 7

  # De poort voor de hostingbackend. Die haalt `<site>-static` óók op als de
  # run is mislukt (bewust: met fail-fast:false mag één kapotte site de andere
  # niet blokkeren), dus een nakijker met rode tests zou zonder deze poort
  # alsnog live gaan. Hier komt een bundle pas als `<site>-static` als zijn
  # build en de tests groen zijn; raakt de wijziging geen test, dan is `test`
  # overgeslagen en mag hij gewoon door.
  #
  # Lint en typecheck blijven bewust buiten deze poort: die falen op eigen
  # kracht de run, en zo blijft zichtbaar welke sites nog wél bouwen.
  publiceer:
    needs: [plan, test, build]
    if: >-
      !cancelled() && needs.plan.outputs.build == 'true'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    steps:
      # Faalde de build van deze site, dan is er geen bundle; de download
      # faalt dan, en deze site wordt niet gepubliceerd. De andere wel.
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.site }}-gebouwd
          path: bundle

      - name: Upload static bundle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.site }}-static
          path: bundle
          if-no-files-found: error

  # De sites die deze wijziging niet raakt, voor cross-links: uit de cache van
  # een eerdere build (main vult hem bij elke push en elke nacht), en bij een
  # misser alsnog gebouwd. Bewust als `<site>-voorraad` en kort bewaard: de
  # hostingbackend pakt alleen `<site>-static` op, en deze sites staan al live.
  voorraad:
    needs: plan
    if: needs.plan.outputs.crosslinks == 'true' && needs.plan.outputs.ongewijzigd != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.ongewijzigd) }}
    steps:
      - uses: actions/checkout@v5

      # pnpm voor site-hash.mjs; de install alleen bij een misser.
      - name: Node en pnpm
        uses: ./.github/actions/node-pnpm
        with:
          store: 'false'
          install: 'false'

      - name: Map en cache-sleutel van ${{ matrix.site }}
        id: map
        run: |
          echo "dir=$(node scripts/sites-json.mjs ${{ matrix.site }})" >> "$GITHUB_OUTPUT"
          echo "sleutel=site-${{ runner.os }}-${{ matrix.site }}-$(node scripts/site-hash.mjs ${{ matrix.site }})" >> "$GITHUB_OUTPUT"

      - name: Uit de cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.map.outputs.dir }}/build
          key: ${{ steps.map.outputs.sleutel }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/node-pnpm
        with:
          map: ${{ steps.map.outputs.dir }}

      # Ook gecomprimeerd: deze build gaat onder dezelfde sleutel de cache in
      # als die van de job `build`, en de job `browser` haalt hem daar weer uit.
      - name: Build ${{ matrix.site }} (niet in de cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter "./${{ steps.map.outputs.dir }}" build
          node scripts/comprimeer.mjs "${{ steps.map.outputs.dir }}/build"

      - name: Build in de cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.map.outputs.dir }}/build
          key: ${{ steps.map.outputs.sleutel }}

      - name: Upload voor cross-links
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.site }}-voorraad
          path: ${{ steps.map.outputs.dir }}/build
          if-no-files-found: error
          retention-days: 1

  # Links tussen cursussen zijn voor Docusaurus externe URL's: onBrokenLinks
  # controleert alleen de eigen site, en de guard-tests in de test-job bootsen
  # de routing van de doelsite na (een benadering die al eens uit de pas
  # liep). Deze job kijkt naar wat de browser krijgt: elke href naar een
  # cursusdomein in de gebouwde HTML, tegen de build van de doelsite. Telt mee
  # in de `build`-check hieronder.
  #
  # Altijd tegen álle sites (--compleet): de geraakte uit `build`, de rest uit
  # `voorraad`. Een link van een ongewijzigde site naar een gewijzigde pagina
  # valt zo ook op.
  cross-links:
    needs: [plan, build, voorraad]
    if: >-
      !cancelled() && needs.plan.outputs.crosslinks == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.voorraad.result == 'success' || needs.voorraad.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Het script heeft geen dependencies: alleen Node, geen pnpm.
      - name: Node
        uses: ./.github/actions/node-pnpm
        with:
          pnpm: 'false'
          store: 'false'
          install: 'false'

      # Matcht een patroon precies één artifact, dan pakt download-artifact
      # dat uit in `path` zelf en niet in `path/<naam>`. Een PR die één site
      # raakt, gaf zo "Geen build van: fullstack": de build stond los in
      # builds/. Daarom elk patroon in een eigen map, en daarna per site een
      # map `<site>-static` (zie `Eén map per site`).
      - uses: actions/download-artifact@v6
        if: needs.plan.outputs.build == 'true'
        with:
          pattern: '*-gebouwd'
          path: geraakt

      - uses: actions/download-artifact@v6
        if: needs.plan.outputs.ongewijzigd != '[]'
        with:
          pattern: '*-voorraad'
          path: voorraad

      - name: Eén map per site
        env:
          GERAAKT: ${{ needs.plan.outputs.build == 'true' && needs.plan.outputs.sites || '[]' }}
          ONGEWIJZIGD: ${{ needs.plan.outputs.ongewijzigd }}
        run: |
          mkdir -p builds
          # $1: de downloadmap, $2: de sites als JSON, $3: het achtervoegsel.
          verdeel() {
            [ -d "$1" ] || return 0
            if [ "$(jq length <<<"$2")" = 1 ]; then
              mv "$1" "builds/$(jq -r '.[0]' <<<"$2")-static"
            else
              for map in "$1"/*"$3"; do
                naam=$(basename "$map")
                mv "$map" "builds/${naam%"$3"}-static"
              done
            fi
          }
          verdeel geraakt "$GERAAKT" -gebouwd
          verdeel voorraad "${ONGEWIJZIGD:-[]}" -voorraad
          ls builds

      - name: Links, afbeeldingen en 3D-modellen tegen de gebouwde sites
        run: node scripts/controleer-cross-links.mjs builds --annotaties --compleet

  # De branch protection eist een check die exact "build" heet, maar een
  # matrix-job rapporteert alleen "build (site)" per site — die eis kon dus
  # nooit vervuld raken en mergen kon alleen met een bypass. Deze verzameljob
  # ís die ene check: hij draait altijd en slaagt alleen als élke site-build
  # slaagde (fail-fast staat uit, dus needs.build.result is pas "success" als
  # alles groen is).
  #
  # Een job die het plan niet nodig had is `skipped`, en dat telt als geslaagd;
  # `failure` en `cancelled` tellen als mislukt. Wat het plan wél nodig had
  # maar toch is overgeslagen, telt ook als mislukt: dan viel er iets ervoor
  # om (een rode test houdt `publiceer` tegen), en dat mag niet groen ogen.
  # De Python-speeltuin in een echte browser (scripts/rooktest-speeltuin.mjs):
  # de gebouwde python-site, met zijn eigen Pyodide en wasm, in Chromium; daar
  # een print, lege variabelen bij elke run, input() via het venster, een
  # turtle-tekening en Stap voor stap. De node-tests draaien Pyodide buiten de
  # browser; dit is de enige plek waar het geheel samen draait. Nodig als de
  # python-site gebouwd wordt (ook bij een wijziging in packages/python-runner)
  # of als het script verandert; dan komt de build uit de cache, of wordt hij
  # hier gebouwd.
  browser:
    needs: [plan, build]
    if: >-
      !cancelled() && needs.plan.outputs.browser == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GEBOUWD: ${{ contains(fromJSON(needs.plan.outputs.sites), 'python') }}
    steps:
      - uses: actions/checkout@v5

      - name: Node, pnpm en dependencies
        uses: ./.github/actions/node-pnpm

      - name: Map en cache-sleutel van python
        id: map
        run: |
          echo "dir=$(node scripts/sites-json.mjs python)" >> "$GITHUB_OUTPUT"
          echo "sleutel=site-${{ runner.os }}-python-$(node scripts/site-hash.mjs python)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v6
        if: env.GEBOUWD == 'true'
        with:
          name: python-gebouwd
          path: ${{ steps.map.outputs.dir }}/build

      - name: Uit de cache
        id: cache
        if: env.GEBOUWD != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.map.outputs.dir }}/build
          key: ${{ steps.map.outputs.sleutel }}

      - name: Build python (niet gebouwd en niet in de cache)
        if: env.GEBOUWD != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter "./${{ steps.map.outputs.dir }}" build
          node scripts/comprimeer.mjs "${{ steps.map.outputs.dir }}/build"

      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: De speeltuin in Chromium
        run: node scripts/rooktest-speeltuin.mjs "${{ steps.map.outputs.dir }}/build" --eis-compressie

  build-klaar:
    name: build
    # Ook `checks` (lint + typecheck) telt mee: een tsc-fout houdt de artifacts
    # niet tegen (die job draait los van `build`), maar maakt deze verplichte
    # check wel rood, zodat hij niet gemerged wordt. Hetzelfde geldt voor de
    # blokrunners (de codevoorbeelden in de lessen); eerst telden die niet,
    # en kon een PR met kapotte voorbeelden groen worden. `tekst` blijft
    # erbuiten: een spel- of stijlfout mag een merge niet tegenhouden (keuze
    # van de opdrachtgever; schrijfgids §17).
    needs: [plan, test, build, publiceer, voorraad, checks, cross-links, fullstack, blokken, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Plan, tests, codevoorbeelden, site-builds, publiceren, lint, typecheck, cross-site links en de speeltuin groen?
        env:
          PLAN: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          PUBLICEER: ${{ needs.publiceer.result }}
          VOORRAAD: ${{ needs.voorraad.result }}
          CHECKS: ${{ needs.checks.result }}
          CROSSLINKS: ${{ needs.cross-links.result }}
          FULLSTACK: ${{ needs.fullstack.result }}
          BLOKKEN: ${{ needs.blokken.result }}
          BROWSER: ${{ needs.browser.result }}
          NODIG_TEST: ${{ needs.plan.outputs.test }}
          NODIG_BUILD: ${{ needs.plan.outputs.build }}
          NODIG_CHECKS: ${{ needs.plan.outputs.checks }}
          NODIG_CROSSLINKS: ${{ needs.plan.outputs.crosslinks }}
          NODIG_FULLSTACK: ${{ needs.plan.outputs.fullstack }}
          NODIG_BLOKKEN: ${{ needs.plan.outputs.blokken }}
          NODIG_BROWSER: ${{ needs.plan.outputs.browser }}
        run: |
          fout=0
          # oordeel <job> <resultaat> <nodig volgens het plan>
          oordeel() {
            case "$2" in
              success) echo "$1: geslaagd" ;;
              skipped)
                if [ "$3" = "true" ]; then
                  echo "::error::$1 was nodig maar is overgeslagen (viel er een job ervoor om?)"
                  fout=1
                else
                  echo "$1: niet nodig voor deze wijziging"
                fi ;;
              *) echo "::error::$1: $2"; fout=1 ;;
            esac
          }
          oordeel plan "$PLAN" true
          oordeel test "$TEST" "$NODIG_TEST"
          oordeel build "$BUILD" "$NODIG_BUILD"
          oordeel publiceer "$PUBLICEER" "$NODIG_BUILD"
          oordeel voorraad "$VOORRAAD" false
          oordeel checks "$CHECKS" "$NODIG_CHECKS"
          oordeel cross-links "$CROSSLINKS" "$NODIG_CROSSLINKS"
          oordeel fullstack "$FULLSTACK" "$NODIG_FULLSTACK"
          oordeel blokken "$BLOKKEN" "$NODIG_BLOKKEN"
          oordeel browser "$BROWSER" "$NODIG_BROWSER"
          exit $fout
