name: Build sites

# Bouwt elke site naar een zelfstandige statische bundle en uploadt die
# als artifact. Geen deploy hier: een aparte backend pakt de artifacts op
# (hosting, A/B-tests, analytics).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Snel achter elkaar pushen op dezelfde branch: alleen de nieuwste build telt.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Aparte, kleine job omdat `build` erop wacht. De nakijker bepaalt wat een
  # leerling als beoordeling ziet, en een scoringsfout geeft geen foutmelding —
  # die telt gewoon stil iets verkeerd. Zulke code mag niet gedeployd worden.
  #
  # Bewust niet samen met lint en typecheck in één job: dan zou een tsc-fout in
  # een willekeurige site de artifacts van alle veertien tegenhouden, en zou de
  # trage typecheck (~30s) elke build vertragen. De installatie hier kost 12s en
  # loopt parallel aan checks, dus dit kost vrijwel geen doorlooptijd.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # De stap-voor-stap-opnemer is Python die in de browser in Pyodide draait.
      # Zijn test draait hem tegen een echte CPython, en die hoort dezelfde
      # taalversie te spreken als Pyodide meelevert: 3.13, zowel in de
      # gebundelde als in de CDN-variant. De runner heeft standaard wel een
      # python3, maar niet noodzakelijk die versie.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (nakijker, editor, DVWA-labs en de stap-opnemer)
        run: pnpm test

  # De godot-cursus laat leerlingen elk script zelf opbouwen, dus staan de
  # tussenstanden alleen in de lestekst. Niets in de docusaurus-build leest die
  # codeblokken: een typefout of een API die in 4.7 niet meer bestaat, komt pas
  # bij een leerling in de klas aan het licht. Deze job draait Godot headless en
  # doet twee dingen: elk blok compileren, en de zeven tussenstanden van het
  # bewegingsscript echt uitvoeren om te zien of ze doen wat de les belooft.
  #
  # Blokkeert `build` bewust niet: dit gaat over de inhoud van de lessen, niet
  # over of de site bouwt.
  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSIE: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # v5 draait op Node 24; v4 werd door de runner geforceerd op Node 24 en
      # gaf daar een deprecation-waarschuwing over. Inputs en de cache-hit
      # output zijn ongewijzigd.
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v5
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSIE }}

      # De bestandsnaam van het asset is per release wel eens veranderd, dus
      # zoeken we hem op in plaats van hem te raden.
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          url=$(gh api "repos/godotengine/godot-builds/releases/tags/${GODOT_VERSIE}" \
            --jq '.assets[] | select(.name | test("linux\\.x86_64\\.zip$")) | .browser_download_url' | head -1)
          echo "Asset: $url"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          mv "$(find /tmp/godot -type f -name 'Godot_v*' | head -1)" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Godot-versie
        run: ~/godot-bin/godot --headless --version

      - name: Codeblokken uit de docs halen
        run: pnpm --filter @coderius/godot-docs godot:extract

      # Eerste run bouwt de importcache op; die eindigt zelf met een exitcode
      # die niets over de tests zegt, vandaar de tweede run.
      - name: Project importeren
        run: ~/godot-bin/godot --headless --path sites/godot/godot-tests --import || true

      # Geen --quit-after: die stopt met code 0 en zou een echte fout maskeren.
      # De runner sluit zelf af; `timeout` is alleen de vangnet tegen vastlopen.
      - name: Codevoorbeelden testen
        run: timeout 300 ~/godot-bin/godot --headless --path sites/godot/godot-tests

      # Een hernoemd menu-item verandert niets aan de code en niets aan de
      # build; het valt pas op als een leerling naar een knop zoekt die er niet
      # meer is. De editor-binary bevat al zijn eigen labels, dus die zoeken we
      # er gewoon in op.
      - name: UI-labels uit de lessen bestaan in deze Godot-versie
        run: |
          set -uo pipefail
          strings -n 2 ~/godot-bin/godot > /tmp/godot-strings.txt
          mist=0
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            # Substring, geen hele regel: Godot hangt er soms iets achter,
            # zoals "Add Child Node..." of "Physics Layer 0".
            if ! grep -qF "$label" /tmp/godot-strings.txt; then
              echo "::error::label '$label' komt niet voor in Godot ${GODOT_VERSIE}"
              mist=$((mist + 1))
            fi
          done < sites/godot/godot-tests/extracted/labels.txt
          echo "$(wc -l < sites/godot/godot-tests/extracted/labels.txt) labels gecontroleerd, $mist niet gevonden."
          exit $((mist > 0))

  # De robotica-lessen bevatten MicroPython die verder nergens wordt
  # uitgevoerd — er is geen board in CI. Deze job compileert elk python-blok
  # uit de docs (puur syntactisch, CPython volstaat daarvoor); een typefout of
  # kapot voorbeeld valt zo hier op in plaats van bij een leerling die hem
  # overtypt. Blokkeert `build` bewust niet: dit gaat over de inhoud van de
  # lessen, niet over of de site bouwt.
  robotica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codeblokken uit de docs halen
        run: pnpm --filter @coderius/robotica-docs lego:extract

      - name: Codevoorbeelden compileren
        run: python3 scripts/compileer-blokken.py sites/robotica/lego-tests/extracted

  # Zelfde verhaal voor de fullstack-cursus: python-blokken die nergens worden
  # uitgevoerd. Extractie én compilatie deelt deze job met robotica
  # (packages/shared/codeblokken.js en scripts/compileer-blokken.py). Bewust
  # kapotte voorbeelden — de FOUT/GOED-blokken in troubleshooting en losse
  # fragmenten uit een handler — slaan we over met de marker
  # `{/* niet-compileren: reden */}`.
  fullstack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codeblokken uit de docs halen
        run: pnpm --filter @coderius/fullstack-docs code:extract

      - name: Codevoorbeelden compileren
        run: python3 scripts/compileer-blokken.py sites/fullstack/code-tests/extracted

  # Play gaat een stap verder dan compileren: elk speeltuin-blok wordt echt
  # uitgevoerd tegen de gebundelde wheel uit static/whl/ — dezelfde die de
  # browser serveert. Kale blokken worden alleen gecompileerd. Bewust kapotte
  # lesvoorbeelden dragen een niet-draaien/niet-compileren-marker.
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # De gebundelde wheel pint zijn dependencies exact. Installeren we hier
      # iets anders, dan test deze job een andere pygame/numpy dan de browser
      # draait — en dat is precies wat de job hoort uit te sluiten. --pins leest
      # de versies uit de METADATA van de wheel zelf.
      - name: Play-dependencies installeren
        run: pip install $(python3 scripts/draai-play-blokken.py --pins)

      - name: Codevoorbeelden uitvoeren tegen de gebundelde wheel
        run: python3 scripts/draai-play-blokken.py

  # De python-cursus zegt bij veel voorbeelden wát er op het scherm komt: als
  # commentaar achter de print-regel, of als uitvoerblok eronder. Die belofte is
  # na te lopen, en dat is een sterkere controle dan "het draait": een blok dat
  # iets anders print dan de les zegt, laat een leerling denken dat híj de fout
  # maakt. Zo stond er in de les over len() een 11 bij een string van 12 tekens.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Codevoorbeelden uitvoeren en de beloofde uitvoer vergelijken
        run: python3 scripts/draai-python-blokken.py

  # Dezelfde controle als de python-cursus, maar dan voor algorithms: elk blok
  # draait of compileert, beloofde uitvoer wordt vergeleken, en de geciteerde
  # foutmeldingen worden tegen echte CPython gereproduceerd. De runners op de
  # site draaien Pyodide 0.27.4 (Python 3.12) met numpy en matplotlib uit
  # static/pyodide/ — dus test deze job op 3.12 en met precies die versies;
  # --pins leest ze uit pyodide-lock.json van de site zelf.
  algorithms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Browser-versies van numpy en matplotlib installeren
        run: pip install $(python3 scripts/draai-python-blokken.py algorithms --pins)

      - name: Codevoorbeelden uitvoeren en de beloofde uitvoer vergelijken
        run: python3 scripts/draai-python-blokken.py algorithms

  # Lestekst is het product van deze repo, maar niets controleerde hem. Een
  # typefout, een emoji, een "u" in plaats van "je" of een alinea vol vet:
  # de build merkt er niets van en een reviewer die honderden regels diff
  # doorleest ook niet. Deze job doet twee dingen op elke lespagina in de
  # repo:
  #
  #   spelling  cspell met de nl_NL-dictionary plus cspell-woorden.txt, de
  #             eigen lijst met vaktermen en samenstellingen.
  #   stijl     de regels uit org-handbook/WRITING_STYLE_GUIDE.md, uitgevoerd
  #             door packages/shared/stijl.js. Code, frontmatter en JSX gaan
  #             er eerst uit; een uitroepteken in print("Klaar!") is geen
  #             stijlfout.
  #
  # Bewust niet-blokkerend, en bewust geen poort voor `build`. De sites die
  # uit losse repos zijn gemigreerd hebben nog een achterstand van 255
  # onbekende woorden en 647 stijlmeldingen; zolang die er is zou blokkeren
  # betekenen dat niemand nog iets kan mergen. De annotaties staan wel meteen
  # in de diff van de pull request, dus nieuwe tekst valt op. Zodra de schuld
  # is opgeruimd: continue-on-error weg en --streng erbij, dan tellen
  # waarschuwingen ook mee.
  #
  # De regels zelf zijn getest in packages/shared/stijl.test.ts, en die test
  # loopt in de `test`-job wél blokkerend mee. Zo kan een regel niet stilletjes
  # stukgaan en toch groen blijven.
  tekst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # cspell schrijft "bestand:regel:kolom - Unknown word (x)". Dat omzetten
      # naar een annotatie zet de melding op de juiste regel in de diff in
      # plaats van onderin het joblog.
      - name: Spelling (cspell)
        continue-on-error: true
        run: |
          set -uo pipefail
          pnpm run spel > "$RUNNER_TEMP/spel.txt" 2>&1 || uitkomst=$?
          sed -n 's|^\(.*\):\([0-9]*\):\([0-9]*\) - \(.*\)$|::warning file=\1,line=\2,col=\3,title=spelling::\4|p' "$RUNNER_TEMP/spel.txt"
          cat "$RUNNER_TEMP/spel.txt"
          aantal=$(grep -c 'Unknown word' "$RUNNER_TEMP/spel.txt" || true)
          {
            echo "## Spelling"
            echo
            echo "$aantal onbekende woorden. Klopt een woord wel? Zet het in \`cspell-woorden.txt\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${uitkomst:-0}

      # Schrijft zelf al annotaties en een tabel in de job-samenvatting.
      - name: Stijl (schrijfgids)
        continue-on-error: true
        run: pnpm run stijl

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Niet-blokkerend: de uit losse repos gemigreerde sites hebben nog
      # honderden bestaande biome-fouten. Zodra die zijn opgeschoond kan
      # continue-on-error weg.
      - name: Lint (biome)
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck (sites + packages)
        run: pnpm typecheck

  build:
    # Alleen op de tests wachten, niet op lint of typecheck. De hostingbackend
    # haalt de artifacts namelijk óók op als de run is mislukt (bewust: met
    # fail-fast:false mag één kapotte site de andere niet blokkeren), dus zonder
    # deze afhankelijkheid zou een nakijker met rode tests alsnog live gaan.
    #
    # Lint en typecheck blijven bewust buiten deze poort: die falen op eigen
    # kracht de run, en zo blijft zichtbaar welke sites nog wél bouwen.
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mapnamen onder sites/; het filter werkt op de map, niet op de
        # package-naam (sites/ide heet @coderius/ide, zonder -docs-suffix).
        site:
          - python
          - web
          - fullstack
          - robotica
          - ctf
          - embedded
          - editor
          - godot
          - dvwa
          - play
          - algorithms
          - ide
          - didactiek
          - home
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.site }}
        run: pnpm --filter "./sites/${{ matrix.site }}" build

      - name: Upload static bundle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.site }}-static
          path: sites/${{ matrix.site }}/build
          if-no-files-found: error

  # De branch protection eist een check die exact "build" heet, maar een
  # matrix-job rapporteert alleen "build (site)" per site — die eis kon dus
  # nooit vervuld raken en mergen kon alleen met een bypass. Deze verzameljob
  # ís die ene check: hij draait altijd en slaagt alleen als élke site-build
  # slaagde (fail-fast staat uit, dus needs.build.result is pas "success" als
  # alles groen is).
  build-klaar:
    name: build
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Alle site-builds gelukt?
        run: test "${{ needs.build.result }}" = "success"
