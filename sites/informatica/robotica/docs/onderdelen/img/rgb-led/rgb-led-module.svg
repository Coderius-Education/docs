<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="Tekening van een RGB-LED-module: een printje met een LED en vier pinnen, gemerkt min, R, G en B">
  <rect x="40" y="20" width="160" height="110" rx="10" fill="#1f4fa8"/>
  <circle cx="58" cy="38" r="6" fill="#ffffff"/>
  <circle cx="182" cy="38" r="6" fill="#ffffff"/>
  <defs>
    <radialGradient id="koepel" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f2e9ff"/>
      <stop offset="100%" stop-color="#c9c3e6"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="70" r="34" fill="url(#koepel)" stroke="#9c94c9" stroke-width="2"/>
  <circle cx="108" cy="62" r="6" fill="#e53935" opacity="0.8"/>
  <circle cx="126" cy="58" r="6" fill="#43a047" opacity="0.8"/>
  <circle cx="122" cy="78" r="6" fill="#1e88e5" opacity="0.8"/>
  <g fill="#d9d9d9" stroke="#8a8a8a">
    <rect x="56" y="130" width="8" height="40"/>
    <rect x="96" y="130" width="8" height="40"/>
    <rect x="136" y="130" width="8" height="40"/>
    <rect x="176" y="130" width="8" height="40"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="60" y="122">−</text>
    <text x="100" y="122">R</text>
    <text x="140" y="122">G</text>
    <text x="180" y="122">B</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">
    <text x="60" y="192">GND</text>
    <text x="100" y="192">rood</text>
    <text x="140" y="192">groen</text>
    <text x="180" y="192">blauw</text>
  </g>
