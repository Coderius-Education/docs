<svg xmlns="http://www.w3.org/2000/svg" viewBox="-250 -200 500 400" role="img">
<title>Dezelfde vijf staven met getallen en namen, maar hoger: de staaf van video's is nu 200 hoog en de andere staven zijn naar verhouding meegegroeid</title>
<rect x="-250" y="-200" width="500" height="400" fill="white"/>
<polygon points="-200,100 -140,100 -140,-18.18 -200,-18.18 -200,100" fill="skyblue" fill-rule="evenodd"/>
<line x1="-200" y1="100" x2="-140" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-140" y1="100" x2="-140" y2="-18.18" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-140" y1="-18.18" x2="-200" y2="-18.18" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-200" y1="-18.18" x2="-200" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<text x="-170" y="-23.18" fill="black" font-size="10.64" font-family="Arial, sans-serif" text-anchor="middle">65 min</text>
<text x="-170" y="118" fill="black" font-size="10.64" font-family="Arial, sans-serif" text-anchor="middle">chatten</text>
<polygon points="-120,100 -60,100 -60,-100 -120,-100 -120,100" fill="skyblue" fill-rule="evenodd"/>
<line x1="-120" y1="100" x2="-60" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-60" y1="100" x2="-60" y2="-100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-60" y1="-100" x2="-120" y2="-100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-120" y1="-100" x2="-120" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<text x="-90" y="-105" fill="black" font-size="10.64" font-family="Arial, sans-serif" text-anchor="middle">110 min</text>
<text x="-90" y="118" fill="black" font-size="10.64" font-family="Arial, sans-serif" text-anchor="middle">video's</text>
<polygon points="-40,100 20,100 20,-45.45 -40,-45.45 -40,100" fill="skyblue" fill-rule="evenodd"/>
<line x1="-40" y1="100" x2="20" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="20" y1="100" x2="20" y2="-45.45" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="20" y1="-45.45" x2="-40" y2="-45.45" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-40" y1="-45.45" x2="-40" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<text x="-10" y="-50.45" fill="black" font-size="10.64" font-family="Arial, sans-serif" text-anchor="middle">80 min</text>
<text x="-10" y="118" fill="black" font-size="10.64" font-family="Arial, sans-serif" text-anchor="middle">gamen</text>
<polygon points="40,100 100,100 100,18.18 40,18.18 40,100" fill="skyblue" fill-rule="evenodd"/>
<line x1="40" y1="100" x2="100" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="100" y1="100" x2="100" y2="18.18" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="100" y1="18.18" x2="40" y2="18.18" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="40" y1="18.18" x2="40" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<text x="70" y="13.18" fill="black" font-size="10.64" font-family="Arial, sans-serif" text-anchor="middle">45 min</text>
<text x="70" y="118" fill="black" font-size="10.64" font-family="Arial, sans-serif" text-anchor="middle">muziek</text>
<polygon points="120,100 180,100 180,45.45 120,45.45 120,100" fill="skyblue" fill-rule="evenodd"/>
<line x1="120" y1="100" x2="180" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="180" y1="100" x2="180" y2="45.45" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="180" y1="45.45" x2="120" y2="45.45" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="120" y1="45.45" x2="120" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<text x="150" y="40.45" fill="black" font-size="10.64" font-family="Arial, sans-serif" text-anchor="middle">30 min</text>
<text x="150" y="118" fill="black" font-size="10.64" font-family="Arial, sans-serif" text-anchor="middle">foto's</text>
</svg>
