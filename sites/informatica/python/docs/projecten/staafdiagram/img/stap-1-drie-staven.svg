<svg xmlns="http://www.w3.org/2000/svg" viewBox="-250 -200 500 400" role="img">
<title>Drie lichtblauwe staven naast elkaar op dezelfde hoogte, de middelste het hoogst</title>
<rect x="-250" y="-200" width="500" height="400" fill="white"/>
<polygon points="-200,100 -140,100 -140,35 -200,35 -200,100" fill="skyblue" fill-rule="evenodd"/>
<line x1="-200" y1="100" x2="-140" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-140" y1="100" x2="-140" y2="35" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-140" y1="35" x2="-200" y2="35" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-200" y1="35" x2="-200" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<polygon points="-120,100 -60,100 -60,-10 -120,-10 -120,100" fill="skyblue" fill-rule="evenodd"/>
<line x1="-120" y1="100" x2="-60" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-60" y1="100" x2="-60" y2="-10" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-60" y1="-10" x2="-120" y2="-10" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-120" y1="-10" x2="-120" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<polygon points="-40,100 20,100 20,20 -40,20 -40,100" fill="skyblue" fill-rule="evenodd"/>
<line x1="-40" y1="100" x2="20" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="20" y1="100" x2="20" y2="20" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="20" y1="20" x2="-40" y2="20" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="-40" y1="20" x2="-40" y2="100" stroke="black" stroke-width="1" stroke-linecap="round"/>
</svg>
