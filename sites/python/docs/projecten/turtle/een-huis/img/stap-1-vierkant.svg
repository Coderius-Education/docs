<svg xmlns="http://www.w3.org/2000/svg" viewBox="-250 -200 500 400" role="img">
<title>Een zwart vierkant met zijden van 100 stappen</title>
<rect x="-250" y="-200" width="500" height="400" fill="white"/>
<line x1="0" y1="0" x2="100" y2="0" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="100" y1="0" x2="100" y2="-100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="100" y1="-100" x2="0" y2="-100" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="0" y1="-100" x2="0" y2="0" stroke="black" stroke-width="1" stroke-linecap="round"/>
<polygon points="0,0 -9,-5 -7,0 -9,5" fill="black" stroke="black" stroke-width="1"/>
</svg>
