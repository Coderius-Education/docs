<svg xmlns="http://www.w3.org/2000/svg" viewBox="-250 -200 500 400" role="img">
<title>Een zwarte driehoek met drie gelijke zijden, met de punt naar boven</title>
<rect x="-250" y="-200" width="500" height="400" fill="white"/>
<line x1="0" y1="0" x2="100" y2="0" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="100" y1="0" x2="50" y2="-86.6" stroke="black" stroke-width="1" stroke-linecap="round"/>
<line x1="50" y1="-86.6" x2="0" y2="0" stroke="black" stroke-width="1" stroke-linecap="round"/>
<polygon points="0,0 -9,-5 -7,0 -9,5" fill="black" stroke="black" stroke-width="1"/>
</svg>
