packages:
  - 'packages/*'
  - 'sites/home'
  # Elke cursus staat onder zijn vak: sites/<vak>/<id> (zie packages/shared/sites.js).
  - 'sites/*/*'

# One pinned version per shared dependency. Sites reference these with
# "catalog:" so every site builds against the same toolchain.
catalog:
  '@docusaurus/core': 3.10.1
  '@docusaurus/preset-classic': 3.10.1
  '@docusaurus/plugin-content-docs': 3.10.1
  '@docusaurus/plugin-pwa': 3.10.1
  '@docusaurus/module-type-aliases': 3.10.1
  '@docusaurus/tsconfig': 3.10.1
  '@docusaurus/types': 3.10.1
  '@docusaurus/theme-mermaid': 3.10.1
  '@easyops-cn/docusaurus-search-local': ^0.55.3
  '@mdx-js/react': ^3.0.0
  clsx: ^2.0.0
  prism-react-renderer: ^2.4.1
  react: ^19.0.0
  react-dom: ^19.0.0
  '@types/react': ^19.0.0
  typescript: ~5.6.2
  monaco-editor: ^0.52.2
  '@monaco-editor/react': ^4.7.0
  idb-keyval: ^6.2.2
  pyodide: ^0.29.3
  vitest: ^4.1.11
